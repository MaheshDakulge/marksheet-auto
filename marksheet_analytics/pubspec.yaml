name: marksheet_analytics
description: Marksheet Analytics App - College Edition. Scan to Excel, CGPA/SGPA analytics.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0 
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP Client
  dio: ^5.9.2

  # File Handling
  file_picker: ^10.3.10
  path_provider: ^2.1.3
  url_launcher: ^6.2.5
  open_filex: ^4.3.4
  

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^8.0.0

  # Charts
  fl_chart: ^0.68.0

  # UI / UX
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  fpdart: ^1.1.0

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  app_links: ^6.4.1 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
dependency_overrides:
  app_links: ^7.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21